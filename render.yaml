# Render Blueprint for the PolyMarker back end (the frontend deploys on Vercel).
# Render dashboard -> New -> Blueprint -> select this repository.
# External services you create first: MongoDB Atlas, Neo4j Aura (see docs/DEPLOYMENT.md).
#
#   polymarker-backend   public web service   Express API gateway (VITE_API_BASE_URL points here)
#   polymarker-ai        private service      FastAPI ai-service, reachable only inside Render
#   polymarker-worker    background worker    Celery OCR + interpretation jobs
#   polymarker-redis     Key Value            Celery broker + results + job/file hand-off

envVarGroups:
  # Shared secret between backend and ai-service (X-Internal-Key).
  - name: polymarker-shared
    envVars:
      - key: INTERNAL_API_KEY
        generateValue: true

  - name: polymarker-ai-env
    envVars:
      - key: JOB_BACKEND
        value: celery
      # Render Key Value has no RedisJSON/RediSearch, so conversation memory
      # falls back to in-process memory (see docs/DEPLOYMENT.md).
      - key: CHECKPOINTER
        value: auto
      - key: MODEL_ARTIFACT_DIR
        value: /models
      - key: OCR_ENGINE
        value: tesseract
      - key: ENABLE_LAYOUTLMV3
        value: "false"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false          # optional; without it summaries use the deterministic template
      - key: NEO4J_URI
        sync: false          # e.g. neo4j+s://xxxx.databases.neo4j.io (blank = in-memory graph)
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false

services:
  - type: keyvalue
    name: polymarker-redis
    plan: free
    maxmemoryPolicy: noeviction   # Celery must never lose queued jobs
    ipAllowList: []               # internal connections only

  - type: pserv
    name: polymarker-ai
    runtime: docker
    plan: starter
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: .
    # Loads the knowledge graph (schema + seed + synthetic-derived bands) into
    # Neo4j on every deploy when NEO4J_URI is set; idempotent MERGE statements.
    preDeployCommand: sh -c '[ -z "$NEO4J_URI" ] || python -m graph_service.loader --artifacts /models'
    envVars:
      - fromGroup: polymarker-ai-env
      - fromGroup: polymarker-shared
      - key: PORT
        value: "8080"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: polymarker-redis
          property: connectionString

  - type: worker
    name: polymarker-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - fromGroup: polymarker-ai-env
      - fromGroup: polymarker-shared
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: polymarker-redis
          property: connectionString

  - type: web
    name: polymarker-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    # Creates the demo admin / clinician / patient accounts if SEED_* are set (idempotent).
    preDeployCommand: node src/scripts/seed.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGO_URI
        sync: false          # MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false          # your Vercel URL(s), comma-separated, e.g. https://careflow.vercel.app
      - key: AI_SERVICE_HOSTPORT
        fromService:
          type: pserv
          name: polymarker-ai
          property: hostport
      - fromGroup: polymarker-shared   # INTERNAL_API_KEY, read by the backend as the ai-service key
      - key: AI_TIMEOUT_MS
        value: "60000"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_CLINICIAN_EMAIL
        sync: false
      - key: SEED_CLINICIAN_PASSWORD
        sync: false
