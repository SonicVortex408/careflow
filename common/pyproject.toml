[project]
name = "polymarker-common"
version = "0.1.0"
description = "Shared, dependency-free domain code for PolyMarker Analytics: biomarker catalog, LOINC/unit normalizer, lab-report text parser, data-quality checks, PROM schema."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ocr = ["pypdf>=5.0", "pypdfium2>=4.30", "pytesseract>=0.3.13", "pillow>=10.4"]
paddle = ["paddleocr>=2.8"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polymarker_common"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
