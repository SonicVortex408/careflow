[project]
name = "ai-service"
version = "1.0.0"
description = "PolyMarker Analytics AI service: OCR ingestion jobs, LOINC normalization, cohort inference, GraphRAG assistant with deterministic clinical guardrails."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polymarker-common[ocr]",
    "graph-service",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "numpy>=1.26",
    "xgboost-cpu>=2.1",
    "langgraph>=0.6",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langchain-google-genai>=2.0",
    "langgraph-checkpoint-redis>=0.1",
]

[project.optional-dependencies]
# Vector-retrieval fallback (medical KB + per-patient indexes). Pulls torch via
# sentence-transformers; the Docker image installs CPU-only torch first.
vector = [
    "faiss-cpu>=1.8",
    "langchain-community>=0.3",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
]

[tool.uv.sources]
polymarker-common = { path = "../common", editable = true }
graph-service = { path = "../graph_service", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx>=0.27", "fakeredis>=2.23"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Header"]

[tool.ruff.lint.isort]
known-first-party = ["app", "polymarker_common", "graph_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
