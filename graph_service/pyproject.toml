[project]
name = "graph-service"
version = "0.1.0"
description = "PolyMarker Analytics clinical knowledge graph: Neo4j schema, curated seed, connector (Neo4j or in-memory fallback)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.20",
    "polymarker-common",
]

[tool.uv.sources]
polymarker-common = { path = "../common", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_service"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
