name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: common } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: uv sync --extra ocr
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q

  graph-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: graph_service } }
    services:
      neo4j:
        image: neo4j:5.26-community
        env: { NEO4J_AUTH: neo4j/ci-password }
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-password 'RETURN 1'"
          --health-interval 10s --health-retries 20
    env: { NEO4J_URI: "bolt://localhost:7687", NEO4J_PASSWORD: ci-password }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q   # includes live Neo4j parity test

  bda-engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: bda_engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-dejavu-core
      - run: uv sync --extra spark
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q   # small end-to-end run incl. Spark/DuckDB parity

  ai-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-service } }
    services:
      redis:
        image: redis/redis-stack-server:7.4.0-v1
        ports: ["6379:6379"]
      neo4j:
        image: neo4j:5.26-community
        env: { NEO4J_AUTH: neo4j/ci-password }
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-password 'RETURN 1'"
          --health-interval 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: Live integration (Celery + Redis checkpointer + Neo4j)
        env:
          REDIS_URL: redis://localhost:6379/0
          NEO4J_PASSWORD: ci-password
          LIVE_NEO4J_URI: bolt://localhost:7687
          AI_INTEGRATION: "1"
          LLM_PROVIDER: none
        run: |
          (cd ../graph_service && uv sync && NEO4J_URI=bolt://localhost:7687 uv run python -m graph_service.loader --artifacts ../models)
          uv run celery -A app.worker.celery_app worker --concurrency=2 &
          sleep 8
          uv run pytest -q tests/test_integration_live.py
      - name: Safety evaluation (guardrails, assistant cases, retrieval)
        env: { LLM_PROVIDER: none }
        run: |
          uv run python - <<'PY'
          import json, sys
          sys.path.insert(0, "../evaluation")
          import run_ai_eval as e
          g = e.eval_guardrails(); r = e.eval_retrieval(); a = e.eval_assistant()
          print(json.dumps({"guardrails": g["unsafe_recall"], "fp": g["safe_false_positive_rate"], "retrieval": r["top1_accuracy"], "assistant": a["pass_rate"]}))
          assert g["unsafe_recall"] == 1.0 and g["safe_false_positive_rate"] == 0.0
          assert r["blocked_document_leaks"] == 0 and a["pass_rate"] == 1.0
          PY

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env: { MONGO_URI_TEST: "mongodb://localhost:27017/polymarker_test" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env: { VITE_API_BASE_URL: "https://example.invalid/api" }
      - name: No hardcoded deployment URLs
        run: "! grep -R --include='*.js' --include='*.jsx' -n 'onrender.com' src"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build ai-service backend frontend
